name: Verify Linux video production image
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux image with production dependencies
        run: docker build -f integrations/aitoearn/source/project/aitoearn-backend/Dockerfile.production -t wishtaday-video:ci integrations/aitoearn/source/project/aitoearn-backend
      - name: Verify both compiled applications load
        run: |
          docker run --rm --network none --entrypoint node wishtaday-video:ci /app/apps/aitoearn-ai/src/main.js --help
          docker run --rm --network none --entrypoint node wishtaday-video:ci /app/apps/aitoearn-server/src/main.js --help
      - name: Verify native image processing and video codecs
        run: |
          docker run --rm --network none --entrypoint node wishtaday-video:ci -e "const {createRequire}=require('node:module');const sharp=createRequire('/app/apps/aitoearn-ai/package.json')('sharp');sharp({create:{width:16,height:16,channels:3,background:'#336699'}}).png().toBuffer().then(b=>{if(!b.length)process.exit(1);console.log('Sharp PNG passed')}).catch(()=>process.exit(1))"
          docker run --rm --network none --entrypoint sh wishtaday-video:ci -ec 'ffmpeg -v error -f lavfi -i color=c=blue:s=320x240:d=1 -f lavfi -i sine=frequency=440:duration=1 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest /tmp/probe.mp4; ffprobe -v error -show_entries format=duration,size -of json /tmp/probe.mp4'
      - name: Report actual image size and dependency footprint
        run: |
          docker image inspect wishtaday-video:ci --format 'Linux image bytes: {{.Size}}'
          docker run --rm --network none --entrypoint sh wishtaday-video:ci -c 'du -sh /app /app/node_modules; test ! -d /app/node_modules/nx; test ! -d /app/node_modules/vitest; test ! -d /app/node_modules/eslint'
